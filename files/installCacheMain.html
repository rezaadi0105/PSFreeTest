<html manifest="../offline.cache">
<head>
<meta charset="utf-8">
<title>PSFree-Lapse v1.5.4 For 7.00-9.60 By Reza A.P</title>
<script>
function DLProgress(e){
    parent.ScrOverlay.style.display="block";
    var Percent = Math.round((e.loaded / e.total) * 100);
    parent.cacheUPDtxt.innerHTML = "Installing Offline Cache...";
    parent.CacheBar.style.width  = Percent + '%';
}

function DisplayCacheProgress(){
    setTimeout(function(){
        parent.cacheUPDtxt.innerHTML = "Cache Installed Successfully";
    }, 1000);
    setTimeout(function(){
        parent.CacheProgress.style.display  = "none";
        parent.cacheUPDtxt.innerHTML = "Press PS button on stick for close Browser then Re-open again";
    }, 2500);
}

// Event handlers
window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached       = function(e){ DisplayCacheProgress(); };
window.applicationCache.onupdateready  = function(e){ DisplayCacheProgress(); };
window.applicationCache.onerror        = function(e){
    parent.cacheUPDtxt.innerHTML = "Error Installing Offline Cache";
};
</script>
</head>
<body>
</body>
</html>
